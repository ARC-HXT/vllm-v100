name: V100 JIT kernel matrix

# Every JIT CUDA kernel build of the V100 patches compiled for sm_70 with ptxas -v: register / spill / static shared
# memory table, failing on spills or > 48 KiB static shared memory not accepted in tools/attpatt_v100_kernel_baseline.json
# (tools/attpatt_v100_kernel_matrix.py). One job, nvcc runs in parallel on all cores of the runner. No GPU needed.
on:
  push:
    branches: ['main', 'v100-*', 'codex/v100-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v100-kernels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.13'
          enable-cache: false

      # Compiler and CUDA headers only (the wheel job's toolkit, without the libraries it links against).
      - uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        id: cuda
        with:
          cuda: '12.8.1'
          method: network
          sub-packages: '["nvcc", "cudart-dev", "cccl"]'
          use-github-cache: 'false'

      # The kernels include torch/extension.h and c10/cuda headers: the CUDA torch wheel without its dependencies
      # provides them (the release's torch, attpatt-v100-wheel.yml).
      - name: Install torch headers and the Python-only vLLM tree
        run: |
          uv venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --no-deps 'torch==2.14.0+cu126' --index-url https://download.pytorch.org/whl/cu126
          uv pip install numpy typing_extensions sympy filelock jinja2 networkx fsspec
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CUDA_HOME=${{ steps.cuda.outputs.CUDA_PATH }}" >> "$GITHUB_ENV"

      - name: Compile every JIT kernel build for sm_70
        run: |
          nvcc --version
          python tools/attpatt_v100_kernel_matrix.py --out dist/kernel-matrix --jobs "$(nproc)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: v100-kernel-matrix-${{ github.sha }}
          path: dist/kernel-matrix/
          if-no-files-found: warn
          retention-days: 7
