name: V100 JIT kernel matrix

# Every JIT CUDA kernel build of the V100 patches compiled for sm_70 with ptxas -v: register / spill / static shared
# memory table, failing on spills or > 48 KiB static shared memory not accepted in tools/attpatt_v100_kernel_baseline.json
# (tools/attpatt_v100_kernel_matrix.py). One job, nvcc runs in parallel on all cores of the runner. No GPU needed.
on:
  push:
    branches: ['main', 'v100-*', 'codex/v100-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v100-kernels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.13'
          enable-cache: false

      # Compiler and CUDA headers only (the wheel job's toolkit, without the libraries it links against).
      - uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        id: cuda
        with:
          cuda: '12.8.1'
          method: network
          sub-packages: '["nvcc", "cudart-dev", "cccl"]'
          use-github-cache: 'false'

      # The tool imports the kernel modules (CPU torch is enough: it loads them from their files, vLLM is not
      # installed); the kernels include torch/extension.h and c10/cuda headers, taken from the include/ of the
      # release's CUDA torch wheel (2.14.0+cu126, attpatt-v100-wheel.yml; the CPU wheel lacks
      # c10/cuda/impl/cuda_cmake_macros.h). Nothing is linked.
      - name: Install torch and the CUDA torch headers
        run: |
          uv venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          uv pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          uvx pip download --no-deps --only-binary=:all: --python-version 3.13 -d "$RUNNER_TEMP/cuwheel" \
            'torch==2.14.0+cu126' --index-url https://download.pytorch.org/whl/cu126
          unzip -q "$RUNNER_TEMP"/cuwheel/torch-*.whl 'torch/include/*' -d "$RUNNER_TEMP/cutorch"
          rm -rf "$RUNNER_TEMP/cuwheel"
          echo "CUDA_HOME=${{ steps.cuda.outputs.CUDA_PATH }}" >> "$GITHUB_ENV"

      - name: Compile every JIT kernel build for sm_70
        run: |
          nvcc --version
          python tools/attpatt_v100_kernel_matrix.py --out dist/kernel-matrix --jobs "$(nproc)" \
            --torch-include "$RUNNER_TEMP/cutorch/torch/include"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: v100-kernel-matrix-${{ github.sha }}
          path: dist/kernel-matrix/
          if-no-files-found: warn
          retention-days: 7
